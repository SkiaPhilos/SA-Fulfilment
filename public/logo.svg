<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,700&amp;family=Noto+Nastaliq+Urdu:wght@700&amp;display=swap');
      .ship-text {
        font-family: 'Montserrat', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 130px;
        fill: #2E1065;
        letter-spacing: -2px;
      }
      .urdu-text {
        font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Urdu Typesetting', 'Arial', sans-serif;
        font-weight: 700;
        font-size: 140px;
        fill: #84CC16;
      }
      .fulfillment-text {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-style: italic;
        font-size: 42px;
        fill: #2E1065;
        letter-spacing: 4px;
      }
    </style>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#381575" />
      <stop offset="100%" stop-color="#240A50" />
    </linearGradient>
    <linearGradient id="limeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#9EE624" />
    </linearGradient>
  </defs>

  <g id="logo-mark" transform="translate(40, 20)">
    <!-- Speed Lines on Left -->
    <rect x="200" y="142" width="76" height="15" rx="7.5" fill="url(#limeGradient)" />
    <rect x="175" y="168" width="101" height="15" rx="7.5" fill="url(#limeGradient)" />
    <rect x="222" y="194" width="54" height="15" rx="7.5" fill="url(#limeGradient)" />

    <!-- Warehouse Roof Gable Outline (Purple) -->
    <path
      d="M 370 76 
         L 442 120 
         L 442 178 
         M 270 148 
         L 270 120 
         L 370 76"
      fill="none"
      stroke="#2E1065"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 3D Isometric Cardboard Box (Deep Purple with White Tape) -->
    <!-- Top Face -->
    <path
      d="M 370 128 
         L 416 154 
         L 370 180 
         L 324 154 Z"
      fill="#431C8A"
    />
    <!-- Top Face White Tape Seam -->
    <path
      d="M 358 122 
         L 382 136 
         L 358 150 
         L 334 136 Z"
      fill="#FFFFFF"
      opacity="0.85"
    />
    <line x1="347" y1="142" x2="393" y2="168" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />

    <!-- Left Face -->
    <path
      d="M 324 154 
         L 370 180 
         L 370 234 
         L 324 208 Z"
      fill="#311464"
    />
    <!-- Right Face -->
    <path
      d="M 370 180 
         L 416 154 
         L 416 208 
         L 370 234 Z"
      fill="#250952"
    />

    <!-- Main Curved Swoosh / Upward Delivery Arrow (Purple) -->
    <path
      d="M 270 286 
         C 320 292, 380 260, 424 202"
      fill="none"
      stroke="#381575"
      stroke-width="18"
      stroke-linecap="round"
    />
    <!-- Arrowhead pointing up-right -->
    <polygon
      points="412,180 448,220 398,224"
      fill="#381575"
    />

    <!-- SHIP Text in Deep Indigo Purple -->
    <text x="70" y="278" class="ship-text">SHIP</text>

    <!-- Urdu "آسان" in Lime Green Vector Path / Glyph -->
    <g transform="translate(436, 150)">
      <!-- Styled calligraphic representation of آسان -->
      <!-- Alif with Madda -->
      <path
        d="M 230 4 
           C 216 2, 206 14, 218 20 
           C 236 26, 260 8, 252 2 
           C 246 -2, 238 2, 230 4 Z"
        fill="url(#limeGradient)"
      />
      <path
        d="M 236 28 
           L 236 128 
           C 236 138, 222 138, 222 128 
           L 222 28 
           C 222 18, 236 18, 236 28 Z"
        fill="url(#limeGradient)"
      />

      <!-- Seen & Noon Swoop (Urdu calligraphic curve) -->
      <path
        d="M 200 62 
           C 185 62, 175 74, 168 86 
           C 162 76, 152 66, 140 68 
           C 128 70, 120 82, 114 96 
           C 95 65, 45 40, 16 75 
           C -10 108, -8 160, 30 188 
           C 72 216, 140 200, 174 152 
           C 192 126, 200 95, 204 68 
           C 205 64, 203 62, 200 62 Z 
           M 82 170 
           C 54 170, 34 150, 34 125 
           C 34 100, 56 86, 78 92 
           C 106 100, 114 134, 114 152 
           C 104 165, 94 170, 82 170 Z"
        fill="url(#limeGradient)"
      />
      <!-- Noon Dot -->
      <circle cx="80" cy="125" r="10" fill="#2E1065" />
    </g>

    <!-- Bottom Subtitle: — Fulfillment — -->
    <g transform="translate(130, 345)">
      <!-- Left green line -->
      <rect x="10" y="24" width="55" height="7" rx="3.5" fill="url(#limeGradient)" />
      <!-- Fulfillment text -->
      <text x="80" y="32" class="fulfillment-text">Fulfillment</text>
      <!-- Right green line -->
      <rect x="425" y="24" width="55" height="7" rx="3.5" fill="url(#limeGradient)" />
    </g>
  </g>
</svg>
